services:
  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
    container_name: food-app-container
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    restart: always
    networks:
      - dr-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-container
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always
    networks:
      - dr-network

networks:
  dr-network:
    driver: bridge
